// @generated by honey. DO NOT EDIT.
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'ai.anyrow'
version = '0.1.0'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
}

repositories {
    mavenCentral()
}

dependencies {
    api 'tools.jackson.core:jackson-databind:3.2.4'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Anyrow API'
                description = 'Official Java SDK for Anyrow (anyrow.ai): turn any document, photo, call, email or website into a row in your table.'
                url = 'https://anyrow.ai'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://spdx.org/licenses/MIT.html'
                    }
                }
                developers {
                    developer {
                        name = 'Anyrow'
                        email = 'oss@anyrow.ai'
                    }
                }
                scm {
                    url = 'https://github.com/anyrow/sdk-java'
                    connection = 'scm:git:https://github.com/anyrow/sdk-java.git'
                    developerConnection = 'scm:git:https://github.com/anyrow/sdk-java.git'
                }
            }
        }
    }
}
