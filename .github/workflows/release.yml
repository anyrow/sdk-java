# Generated by honey-clients release sync from release.config.ts; the next sync overwrites any edit.
# Publishes the tag sync pushes (or the one given to a manual run) to: maven.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, as vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is the version the package publishes
        run: |
          VERSION="${TAG#v}"
          FOUND="$(jq -er '.packages[] | select(.registry == "maven-central") | .version' .honey-generated.json)"
          [ "$FOUND" = "$VERSION" ] || { echo "::error::tag $TAG, but .honey-generated.json holds version $FOUND"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Maven Central bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/m2"
          gradle --no-daemon publishToMavenLocal -Dmaven.repo.local="$STAGE"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          GROUP="$(sed -n "s/^group = '\(.*\)'$/\1/p" build.gradle)"
          ARTIFACT="$(sed -n "s/^rootProject.name = '\(.*\)'$/\1/p" settings.gradle)"
          REL="$(printf '%s' "$GROUP" | tr . /)/$ARTIFACT/$VERSION"
          cd "$STAGE/$REL"
          rm -f _remote.repositories maven-metadata*
          for FILE in *; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$MAVEN_GPG_PASSPHRASE" --armor --detach-sign "$FILE"
            md5sum "$FILE" | cut -d " " -f 1 > "$FILE.md5"
            sha1sum "$FILE" | cut -d " " -f 1 > "$FILE.sha1"
          done
          cd "$STAGE"
          zip -qr "$RUNNER_TEMP/bundle.zip" "$REL"
      - name: Maven Central upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          CENTRAL_PORTAL_URL: https://central.sonatype.com
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          ID="$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -F "bundle=@$RUNNER_TEMP/bundle.zip" "$CENTRAL_PORTAL_URL/api/v1/publisher/upload?publishingType=AUTOMATIC")"
          echo "DEPLOYMENT_ID=$ID" >> "$GITHUB_ENV"
      - name: Maven Central publishes the deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          CENTRAL_PORTAL_URL: https://central.sonatype.com
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          for _ in $(seq "${PORTAL_TRIES:-60}"); do
            BODY="$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$CENTRAL_PORTAL_URL/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            STATE="$(printf '%s' "$BODY" | jq -r .deploymentState)"
            case "$STATE" in
              PUBLISHED) echo "Maven Central published deployment $DEPLOYMENT_ID"; exit 0 ;;
              PENDING | VALIDATING | VALIDATED | PUBLISHING) sleep "${PORTAL_WAIT:-10}" ;;
              FAILED) echo "::error::Maven Central refused deployment $DEPLOYMENT_ID: $(printf '%s' "$BODY" | jq -c .errors)"; exit 1 ;;
              *) echo "::error::Maven Central reports deployment $DEPLOYMENT_ID as $STATE"; exit 1 ;;
            esac
          done
          echo "::error::Maven Central did not publish deployment $DEPLOYMENT_ID in time"
          exit 1
      - name: maven serves the version
        run: |
          NAME="$(jq -er '.packages[] | select(.registry == "maven-central") | .name' .honey-generated.json)"
          for _ in $(seq "${LIVE_CHECK_TRIES:-180}"); do
            if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/$(printf '%s' "${NAME%%:*}" | tr . /)/${NAME#*:}/$VERSION/${NAME#*:}-$VERSION.pom"; then echo "maven serves $NAME $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::maven does not serve $NAME $VERSION; the publish above did not land"
          exit 1
